<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Cookie 定时同步设置</title>
  <style>
    body {
      width: 330px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 10px;
      margin: 0;
      box-sizing: border-box;
      background-color: #fff;
      color: #333;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .top-bar h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: #222;
    }
    .top-actions {
      display: flex;
      gap: 5px;
    }

    .btn-create {
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-create:hover { background-color: #0056b3; }

    .btn-sync-all {
      background-color: #34c759;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-sync-all:hover { background-color: #28a745; }

    /* 表单卡片（默认隐藏） */
    #formCard {
      display: none;
      background: #f8f9fa;
      border: 1px solid #e2e4e8;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }
    .form-header h4 {
      margin: 0 0 8px 0;
      font-size: 12px;
      color: #333;
    }

    .form-group { margin-bottom: 8px; }
    label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #555; }
    input, select { padding: 5px 6px; font-size: 11px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    input[type="url"], input[type="text"] { width: 100%; }

    .interval-container {
      display: flex;
      gap: 6px;
    }
    .interval-input { flex: 2; }
    .interval-unit { flex: 1; background-color: #fff; }

    /* 勾选框样式 */
    .checkbox-group {
      margin-top: 6px;
      margin-bottom: 8px;
      background: #fff;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #e5e5ea;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: normal;
      color: #333;
      cursor: pointer;
      user-select: none;
      margin-bottom: 0;
    }
    .checkbox-label input[type="checkbox"] {
      margin: 0;
      cursor: pointer;
    }

    .btn-test {
      width: 100%;
      padding: 5px;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      margin-top: 4px;
    }
    .btn-test:hover { background-color: #0056b3; }

    .btn-action-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .btn-save {
      flex: 2;
      padding: 6px;
      background-color: #8e8e93;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: not-allowed;
      font-size: 11px;
      font-weight: bold;
    }

    .btn-cancel {
      flex: 1;
      padding: 6px;
      background-color: #e5e5ea;
      color: #333;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }
    .btn-cancel:hover { background-color: #d1d1d6; }

    .preview-box {
      display: none;
      margin-top: 6px;
      padding: 6px;
      border: 1px dashed #ccc;
      border-radius: 4px;
      background-color: #fff;
      font-size: 10px;
    }
    .preview-status { font-weight: bold; margin-bottom: 3px; word-break: break-all; }
    .preview-textarea {
      width: 100%;
      height: 38px;
      font-family: monospace;
      font-size: 10px;
      resize: none;
      border: 1px solid #ddd;
      border-radius: 3px;
      box-sizing: border-box;
      background-color: #fafafa;
      color: #333;
    }

    .list-title {
      font-size: 12px;
      font-weight: bold;
      color: #666;
      margin: 0 0 6px 0;
    }

    .rule-item {
      border: 1px solid #e2e4e8;
      padding: 8px;
      margin-bottom: 7px;
      border-radius: 6px;
      background: #fafbfc;
      font-size: 11px;
    }
    .rule-item.paused {
      background: #f4f4f5;
      border-color: #d8d8dc;
      opacity: 0.85;
    }

    .rule-item p {
      margin: 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
    }

    .badge {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
      color: white;
      margin-bottom: 3px;
    }
    .badge-enabled { background-color: #34c759; }
    .badge-paused { background-color: #ff9500; }
    .badge-mode {
      background-color: #5856d6;
      margin-left: 4px;
    }

    .btn-group-item {
      margin-top: 6px;
      display: flex;
      gap: 4px;
    }
    .btn-group-item button {
      flex: 1;
      text-align: center;
      padding: 3px 0;
      font-size: 11px;
      border: none;
      color: white;
      border-radius: 3px;
      cursor: pointer;
    }

    .btn-sync { background-color: #34c759; }
    .btn-edit { background-color: #5856d6; }
    .btn-delete { background-color: #ff3b30; }
    .btn-toggle-pause { background-color: #ff9500; }
    .btn-toggle-enable { background-color: #007aff; }

    .btn-edit:hover { background-color: #4442b5; }
    .btn-delete:hover { background-color: #d32f2f; }
  </style>
</head>
<body>
  <!-- 顶部主栏 -->
  <div class="top-bar">
    <h3>Cookie 同步任务</h3>
    <div class="top-actions">
      <button id="showAddFormBtn" class="btn-create">+ 新建</button>
      <button id="syncAllBtn" class="btn-sync-all" title="立即同步列表中所有【已启用】的任务">全部同步</button>
    </div>
  </div>

  <!-- 新建/编辑任务表单（默认隐藏） -->
  <div id="formCard">
    <div class="form-header">
      <h4 id="formTitle">新建同步任务</h4>
    </div>

    <div class="form-group">
      <label>1. 目标网站 URL</label>
      <input type="url" id="siteUrl" placeholder="https://github.com" required>
      <button id="testBtn" class="btn-test">第一步：检测并预览 Cookie</button>
    </div>

    <div id="previewArea" class="preview-box">
      <div id="previewStatus" class="preview-status"></div>
      <textarea id="previewText" class="preview-textarea" readonly placeholder="Cookie 内容将展示在这里..."></textarea>
    </div>

    <div class="form-group" style="margin-top: 6px;">
      <label>2. 本地绝对路径 / 文件名</label>
      <input type="text" id="filePath" placeholder="/Users/username/Desktop/github_cookies.txt" required>
    </div>

    <div class="form-group">
      <label>3. 同步周期</label>
      <div class="interval-container">
        <input type="number" id="interval" class="interval-input" min="1" value="15" required>
        <select id="intervalUnit" class="interval-unit">
          <option value="minutes" selected>分钟</option>
          <option value="hours">小时</option>
          <option value="days">天</option>
        </select>
      </div>
    </div>

    <!-- 新增：刷新机制配置 -->
    <div class="form-group checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" id="autoRefreshTab">
        <span>同步前后台静默刷新 (防Cookie过期/JS换票)</span>
      </label>
    </div>

    <div class="btn-action-group">
      <button id="addBtn" class="btn-save" disabled>第二步：确认保存</button>
      <button id="cancelBtn" class="btn-cancel">取消</button>
    </div>
  </div>

  <!-- 任务列表区域 -->
  <div class="list-title">已配置任务</div>
  <div id="ruleList"></div>

  <script src="popup.js"></script>
</body>
</html>
